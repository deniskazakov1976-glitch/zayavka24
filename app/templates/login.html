<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Заявка 24/7</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1b2a4a 0%, #0d1320 55%, #070a12 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6edf7;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: rgba(19,26,40,.92); border: 1px solid #24304a;
    border-radius: 18px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.2px; }
  p.sub { margin: 0 0 26px; color: #8b9bb4; font-size: 14px; }
  label { display: block; font-size: 13px; color: #a9b7cc; margin: 0 0 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 16px; border-radius: 10px;
    border: 1px solid #2b3852; background: #0f1626; color: #e6edf7; font-size: 15px;
  }
  input:focus { outline: none; border-color: #4c7dff; box-shadow: 0 0 0 3px rgba(76,125,255,.18); }
  button {
    width: 100%; padding: 13px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #4c7dff, #3a63d8); color: #fff;
    font-size: 15px; font-weight: 600; letter-spacing: .2px;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    background: rgba(255,77,90,.12); border: 1px solid rgba(255,77,90,.4); color: #ff8b95;
    padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 18px;
  }
  .hint { margin-top: 18px; font-size: 12px; color: #6f7f96; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Заявка 24/7</h1>
    <p class="sub">Вход в кабинет</p>
    <div class="error" id="err" style="display:none">Неверный логин или пароль</div>
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <div class="hint">Доступ выдаёт владелец платформы</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
